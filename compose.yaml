version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: db_enquetes_smf
    environment:
      POSTGRES_USER: Ezechiel
      POSTGRES_PASSWORD: brouezechiel2102
      POSTGRES_DB: smf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer_enquetes_smf
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: